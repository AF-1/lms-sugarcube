# .github/workflows/automerge-usercontrib.yml
name: Auto-merge usercontrib branches

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - usercontrib_HB64
      - usercontrib_saysaar

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.draft == false &&
      (
        (github.event.pull_request.base.ref == 'usercontrib_HB64' && github.event.pull_request.user.login == 'HB64') ||
        (github.event.pull_request.base.ref == 'usercontrib_saysaar' && github.event.pull_request.user.login == 'saysaar')
      )
    steps:
      - name: Merge PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --merge \
            --repo "${{ github.repository }}"